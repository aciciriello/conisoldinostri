# Aggiornamento settimanale dei dati e pubblicazione su GitHub Pages.
# Parte ogni lunedì mattina (5:30 UTC), a ogni modifica del sito e a mano
# da Actions → "Aggiorna e pubblica" → Run workflow.
# Se i controlli di aggiorna.py falliscono, i dati precedenti restano pubblicati
# e l'esecuzione risulta fallita: GitHub manda un'email al proprietario.
name: Aggiorna e pubblica

on:
  schedule:
    - cron: "30 5 * * 1"
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.pubblica.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Scarica i dati e fa i controlli
        id: dati
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          TZ: Europe/Rome
        run: python scripts/aggiorna.py

      - name: Salva i nuovi dati nel repository
        if: github.event_name != 'push'
        run: |
          git config user.name "conisoldinostri-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data scripts/rapporti
          git diff --cached --quiet || git commit -m "Aggiornamento dati del $(date +%d/%m/%Y)"
          git pull --rebase
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Pubblica
        id: pubblica
        uses: actions/deploy-pages@v4

      - name: Segnala gli errori dell'aggiornamento
        if: steps.dati.outcome == 'failure'
        run: |
          cat scripts/rapporti/ultimo.md
          echo "::error::Aggiornamento con errori: i dati precedenti restano pubblicati. Vedi scripts/rapporti/ultimo.md"
          exit 1
